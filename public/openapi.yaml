    DeletionReceipt:
      type: object
      required:
        - ok
        - result
      properties:
        ok:
          type: boolean
          enum:
            - true
        result:
          type: object
          properties:
            operationId:
              type: string
              minLength: 10
              maxLength: 100
              pattern: ^rdel_[A-Za-z0-9_-]+$
            releaseId:
              type: string
              minLength: 5
              maxLength: 100
              pattern: ^rel_[A-Za-z0-9_-]+$
            state:
              type: string
              enum:
                - pending
                - completed
                - failed
            statusUrl:
              type: string
              minLength: 1
              maxLength: 240
            acceptedAt:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            updatedAt:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            retryAfterMs:
              type: integer
              exclusiveMinimum: 0
              maximum: 9007199254740991
            completedAt:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            failedAt:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            failure:
              type: object
              properties:
                code:
                  type: string
                  const: RELEASE_DELETION_FAILED
                message:
                  type: string
                  minLength: 1
                  maxLength: 240
              required:
                - code
                - message
              additionalProperties: false
          required:
            - operationId
            - releaseId
            - state
            - statusUrl
            - acceptedAt
            - updatedAt
          additionalProperties: false
          allOf:
            - if:
                properties:
                  state:
                    const: pending
              then:
                required:
                  - retryAfterMs
                not:
                  anyOf:
                    - required:
                        - completedAt
                    - required:
                        - failedAt
                    - required:
                        - failure
            - if:
                properties:
                  state:
                    const: completed
              then:
                required:
                  - completedAt
                not:
                  anyOf:
                    - required:
                        - retryAfterMs
                    - required:
                        - failedAt
                    - required:
                        - failure
            - if:
                properties:
                  state:
                    const: failed
              then:
                required:
                  - failedAt
                  - failure
                not:
                  anyOf:
                    - required:
                        - retryAfterMs
                    - required:
                        - completedAt
