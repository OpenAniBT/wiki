                    ❁ Producers:　田中瑛 / 橋本京佳 / 古川雄太 / 井东真一 / 大和田智之 / 三浦史 / 纪东辉  </p>
                    <p>❁ Cast<br>
                    铃代纱弓 as Botan Kamiina (voice)<br>
