              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: 请求过于频繁
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/torrent/{releaseId}.torrent:
    get:
      tags:
        - torrent
      operationId: torrent
      summary: 下载番剧种子
      description: >
        返回该发布的公开种子。没有种子或未知发布返回 `404`；公开对象暂不可用返回 `503`，并带 `Retry-After`。

        成功响应的关键头部是 `ETag`、`X-Torrent-Content-SHA256`、`X-Torrent-Info-Hash`、`Content-Type: application/x-bittorrent` 和 `Cache-Control`。

        公开种子已包含站点 tracker；旧的 `X-AniBT-Torrent-Source` 与 policy revision 头已退役。

        `releaseId` 为 `rel_*`。

        不接受 query。支持 GET、HEAD、OPTIONS；ETag 未变时返回 304。错误响应为 JSON envelope。
      parameters:
        - name: releaseId
          in: path
          required: true
          description: 番剧发布 ID，`rel_*`
          schema:
            type: string
            pattern: ^rel_[A-Za-z0-9_-]+$
      responses:
        "200":
          description: 种子文件
          headers:
            ETag:
              schema:
                type: string
            X-Torrent-Content-SHA256:
              schema:
                type: string
            X-Torrent-Info-Hash:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
                example: application/x-bittorrent
          content:
            application/x-bittorrent:
              schema:
                type: string
                format: binary
        "304":
          description: 内容未变，响应体为空
        "400":
          description: 无效路径或存在查询参数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: 请求过于频繁
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          headers:
            Retry-After:
              description: 重试前等待秒数。
              schema:
                type: integer
                minimum: 1
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/other-torrent/{releaseId}.torrent:
    get:
      tags:
        - torrent
      operationId: other-torrent
      summary: 下载其他类种子
      description: |
        返回其他类发布的公开种子。`releaseId` 为 `orel_*`。
        没有种子或未知发布返回 `404`；公开对象暂不可用返回 `503`，并带 `Retry-After`。
        不接受 query。支持 GET、HEAD、OPTIONS；ETag 未变时返回 304。错误响应为 JSON envelope。
      parameters:
        - name: releaseId
          in: path
          required: true
          description: 其他类发布 ID，`orel_*`
          schema:
            type: string
            pattern: ^orel_[A-Za-z0-9_-]+$
      responses:
        "200":
          description: 种子文件
          content:
            application/x-bittorrent:
              schema:
                type: string
                format: binary
        "304":
          description: 内容未变，响应体为空
        "400":
          description: 无效路径或存在查询参数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: 请求过于频繁
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          headers:
            Retry-After:
              description: 重试前等待秒数。
              schema:
                type: integer
                minimum: 1
        "503":
          $ref: "#/components/responses/Unavailable"
  /torznab/api:
    get:
      tags:
        - rss
      operationId: torznab-api
      summary: Torznab 协议
      description: >
        Sonarr、Radarr、Prowlarr 的匿名 Torznab 入口。客户端 URL 为 https://anibt.net/torznab，API Path 为 /api。

        不需要 API Key，apikey 参数会被忽略。支持 GET、HEAD；响应 no-store。

        t=caps 返回能力 XML；search、tvsearch、movie 返回 RSS XML。协议参数错误仍返回 HTTP 200 的 <error> XML，不能只按 HTTP 状态判断成功。

        不支持 TVDB/TMDB/IMDb/rid/tvmazeid 检索，提供这些 ID 会返回空列表。关键词最多 160 UTF-8 字节、16 个正向词和 8 个排除词，超出时返回错误 201。search/tvsearch 的尾部 2–4 位数字可作为集数；尾部 1900–2099 按年份移除。movie 仅移除年份。

        关键词按「开放 API 总览」的「资源搜索」匹配，结果固定按发布时间倒序。指定集数或剧场版分类（cat 含 2000 或 2020 且不含 5000 或 5070）时，先按这些条件过滤，再取最新的 100 条。只有分隔符、符号或排除词的 q 返回空列表。

        limit 默认 100，上限 100；最新列表 offset + limit 最多 300，关键词搜索最多 100；超出窗口返回空列表。默认 60 次 / 60 秒 / IP。

        带关键词时 total 是这次搜索最多 100 条结果的条数，不是全部匹配数，在窗口内不随 limit 和 offset 变化。不带关键词时 total 可能是估算值。limit=0、超出窗口、提供 ID 或分类全部未知的请求先返回 total 为 0 的空列表，不检查词数。
      parameters:
        - name: t
          in: query
          required: true
          schema:
            type: string
            enum:
              - caps
              - search
              - tvsearch
              - movie
          description: 缺失返回 XML 错误 200；未知功能返回 202；music/book 返回 203。
        - name: q
          in: query
          schema:
            type: string
          description: 关键词，规范化后最多 160 UTF-8 字节，最多 16 个正向词和 8 个排除词。
        - name: cat
          in: query
          schema:
            type: string
          description: 逗号分隔分类；5000/5070 为番剧，2000/2020 为剧场版。
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
            default: 100
          description: 超过 100 按 100 处理；0 返回空列表。
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: 能力、搜索结果或协议错误 XML；检查根元素及 error code。
          content:
            application/rss+xml:
              schema:
                type: string
              examples:
                torznab-caps:
                  summary: torznab-caps
                  value: |
                    <?xml version="1.0" encoding="UTF-8"?>
                    <caps>
                      <server title="AniBT" />
                      <limits max="100" default="100" />
                      <searching>
                        <search available="yes" supportedParams="q" />
                        <tv-search available="no" />
                        <movie-search available="yes" supportedParams="q" />
                        <audio-search available="no" />
                        <book-search available="no" />
                      </searching>
                      <categories>
                        <category id="5000" name="TV">
                          <subcat id="5070" name="Anime" />
                        </category>
                        <category id="2000" name="Movies">
                          <subcat id="2020" name="Movies/Other" />
                        </category>
                      </categories>
                    </caps>
                torznab-search:
                  summary: torznab-search
                  value: >
                    <?xml version="1.0" encoding="UTF-8"?>

                    <rss version="2.0" xmlns:torznab="http://torznab.com/schemas/2015/feed" xmlns:newznab="http://www.newznab.com/DTD/2010/feeds/attributes/">
                      <channel>
                        <title>AniBT</title>
                        <link>https://anibt.net/</link>
                        <description>AniBT anime releases (Torznab)</description>
                        <language>zh-cn</language>
                        <newznab:response offset="0" total="2" />
                        <item>
                          <title>[绿茶字幕组] 无职转生 第三季 ～到了异世界就拿出真本事～ / Mushoku Tensei S3 [09][WebRip][1080p][简繁日内封]</title>
                          <guid isPermaLink="false">rel_aM2SHvOtUlhx</guid>
                          <link>https://anibt.net/api/torrent/rel_aM2SHvOtUlhx.torrent</link>
                          <comments>https://anibt.net/release/rel_aM2SHvOtUlhx</comments>
                          <pubDate>Fri, 25 Sep 2026 15:52:25 +0800</pubDate>
                          <enclosure url="https://anibt.net/api/torrent/rel_aM2SHvOtUlhx.torrent" length="357873674" type="application/x-bittorrent" />
                          <torznab:attr name="size" value="357873674" />
                          <torznab:attr name="category" value="5000" />
                          <torznab:attr name="category" value="5070" />
                          <torznab:attr name="infohash" value="d536523c36c24a823c632015789bf60a2fcfe831" />
                          <torznab:attr name="seeders" value="40" />
                          <torznab:attr name="leechers" value="8" />
                          <torznab:attr name="peers" value="48" />
                          <torznab:attr name="grabs" value="44" />
                          <torznab:attr name="downloadvolumefactor" value="0" />
                          <torznab:attr name="uploadvolumefactor" value="1" />
                        </item>
                      </channel>
                    </rss>
                torznab-invalid:
                  summary: torznab-invalid
                  value: |
                    <?xml version="1.0" encoding="UTF-8"?>
                    <error code="200" description="Missing parameter" />
        "304":
          description: If-None-Match 匹配，正文为空。
        "429":
          description: 请求过于频繁。
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: 搜索暂不可用，按 Retry-After 重试。
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        字幕组 API Key。`Authorization: Bearer <KEY>`。与 `X-API-Key` 二选一，Bearer 优先。
        Key scope：`releases:publish`、`releases:delete`、`releases:sync:read`，至少选一个。
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 字幕组 API Key。Bearer 优先。
  parameters:
    BgmId:
      name: bgmId
      in: query
      description: Bangumi subject id
      schema:
        type: integer
    GroupSlug:
      name: groupSlug
      in: query
      description: 字幕组 slug
      schema:
        type: string
    RssLimit:
      name: limit
      in: query
      description: |
        1–100，单个无前导零整数。默认 100。省略即拉满。不要传 `limit=100`，否则可能 308。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    Resolution:
      name: resolution
      in: query
      description: 可重复或逗号分隔。4K / 2160p / 1080p / 720p / 480p / 360p
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Resolution'
      style: form
      explode: true
    Language:
      name: language
      in: query
      description: 可重复或逗号分隔
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Language'
      style: form
      explode: true
    Format:
      name: format
      in: query
      description: 可重复或逗号分隔。MKV / MP4 / AVI / WEBM
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ContainerFormat'
      style: form
      explode: true
    Subtitle:
      name: subtitle
      in: query
      description: 可重复或逗号分隔。EXTERNAL / INTERNAL / EMBEDDED / NONE
      schema:
        type: array
        items:
          $ref: '#/components/schemas/SubtitleMode'
      style: form
      explode: true
    SearchQ:
      name: q
      in: query
      description: 关键词。UTF-8 最多 160 bytes，最多 16 个正向词和 8 个排除词。不能空、不能含控制字符
      schema:
        type: string
    AnimeReleaseId:
      name: releaseId
      in: path
      required: true
      description: '`rel_*`，5–100 字符'
      schema:
        type: string
        pattern: '^rel_[A-Za-z0-9_-]+$'
        minLength: 5
        maxLength: 100
  responses:
    BadRequest:
      description: 参数或 JSON 有误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 认证未通过
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 无权限或缺少 scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 资源不存在，或无权访问时与不存在相同
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: 超限。按 Retry-After 退避。公开读取超限同样返回 429；Cloudflare 边缘限流可能是 HTML 429
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: 服务暂时不可用或部署中，按 Retry-After 重试
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Resolution:
      type: string
      enum: [ 4K, 2160p, 1080p, 720p, 480p, 360p ]
    Language:
      type: string
      enum: [ CHS, CHT, JP, EN, KO, ES, PT, FR, DE, IT, RU, AR, HI, ID, MS, TH, VI, TL, TR, PL, UK ]
    ContainerFormat:
      type: string
      enum: [ MKV, MP4, AVI, WEBM ]
    SubtitleMode:
      type: string
      enum: [ EXTERNAL, INTERNAL, EMBEDDED, NONE ]
    OtherCategory:
      type: string
      enum: [ manga, music, raw, stage, collection, movie, other ]
    AnimeIdType:
      type: string
      enum: [ bgm, anilist, mal, anidb ]
    Scope:
      type: string
      enum: [ releases:publish, releases:delete, releases:sync:read ]
    NyaaCategory:
      type: string
      description: |
        Nyaa 分类代码。中文动画字幕常用 `1_3`。
        `1_1` Anime - AMV；`1_2` English-translated；`1_3` Non-English-translated；`1_4` Raw；
        `2_1` Audio Lossless；`2_2` Audio Lossy；
        `3_1` Literature English；`3_2` Literature Non-English；`3_3` Literature Raw；
        `4_1` Live Action English；`4_2` Idol/PV；`4_3` Live Action Non-English；`4_4` Live Action Raw；
        `5_1` Pictures Graphics；`5_2` Pictures Photos；
        `6_1` Software Applications；`6_2` Software Games。
      enum:
        - '1_1'
        - '1_2'
        - '1_3'
        - '1_4'
        - '2_1'
        - '2_2'
        - '3_1'
        - '3_2'
        - '3_3'
        - '4_1'
        - '4_2'
        - '4_3'
        - '4_4'
        - '5_1'
        - '5_2'
        - '6_1'
        - '6_2'
    ErrorEnvelope:
      type: object
      required:
        - ok
        - error
      properties:
        ok:
          type: boolean
          enum:
            - false
        error:
          type: object
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
              example: RATE_LIMIT_EXCEEDED
            message:
              type: string
            reason:
              type: string
              example: RATE_LIMITED
            retryable:
              type: boolean
            retryAfterMs:
              type: integer
            requestId:
              type: string
            details:
              description: 可选错误详情，结构取决于错误码。
            i18n:
              type: object
              required:
                - key
              properties:
                key:
                  type: string
                params:
                  type: object
                  additionalProperties: true
    SubtitleGroup:
      type: object
      required:
        - slug
        - name
        - organizationId
        - status
        - totalReleases
        - totalAnimes
        - createdAt
      properties:
        slug:
          type: string
          description: 稳定标识，用于 groupSlug
        name:
          type: string
          description: 展示名，可能调整
        organizationId:
          type: string
          description: 内部 ID，不要硬编码
        status:
          type: string
          enum:
            - ACTIVE
        totalReleases:
          type: number
          description: 总发布数
        totalAnimes:
          type: number
          description: 覆盖番剧数
        website:
          type: string
          description: 站外主页
        createdAt:
          type: number
          description: 入库时间，毫秒
    SubtitleGroupListResponse:
      type: object
      required: [ ok, data ]
      properties:
        ok:
          type: boolean
          enum: [ true ]
        data:
          type: array
          items:
            $ref: '#/components/schemas/SubtitleGroup'
    SubtitleGroupMeResponse:
      type: object
      required:
        - ok
        - data
      properties:
        ok:
          type: boolean
          enum:
            - true
        data:
          type: object
          required:
            - organizationId
            - name
            - slug
            - status
            - createdAt
            - stats
            - apiKeyId
            - apiKeySuffix
            - scopes
          properties:
            organizationId:
              type: string
              description: 当前 Key 所属字幕组的组织 ID。
            name:
              type: string
            slug:
              type: string
            status:
              type: string
              enum:
                - ACTIVE
            createdAt:
              type: number
            stats:
              type: object
              required:
                - totalReleases
                - totalAnimes
                - memberCount
              properties:
                totalReleases:
                  type: number
                totalAnimes:
                  type: number
                memberCount:
                  type: number
            apiKeyId:
              type: string
            apiKeySuffix:
              type: string
            scopes:
              type: array
              items:
                $ref: "#/components/schemas/Scope"
    BgmSearchItem:
      type: object
      required:
        - bgmId
        - name
        - nameCn
        - date
        - image
        - rating
        - totalEpisodes
        - url
        - premiere
        - seasonYear
        - season
      properties:
        bgmId:
          type: integer
        name:
          type: string
        nameCn:
          type:
            - string
            - "null"
        date:
          type:
            - string
            - "null"
          description: 仅首播精度为 day 时返回 YYYY-MM-DD；其他精度或未知为 null。
        image:
          type:
            - string
            - "null"
        rating:
          type: number
          minimum: 0
          maximum: 10
          description: 0–10。无有效评分时为 5.0，真实 0 保留。
          x-scale-maximum: 10
        totalEpisodes:
          type:
            - integer
            - "null"
        url:
          type: string
        premiere:
          anyOf:
            - $ref: "#/components/schemas/AnimePremiere"
            - type: "null"
        seasonYear:
          type:
            - integer
            - "null"
        season:
          type:
            - string
            - "null"
          enum:
            - WINTER
            - SPRING
            - SUMMER
            - FALL
            - null
    BgmSearchResponse:
      type: object
      required: [ ok, data ]
      properties:
        ok:
          type: boolean
          enum: [ true ]
        data:
          type: array
          items:
            $ref: '#/components/schemas/BgmSearchItem'
    SeasonsAnimeResponse:
      type: object
      required:
        - ok
        - ts
        - data
      properties:
        ok:
          type: boolean
          enum:
            - true
        ts:
          type: number
          description: 响应生成时间，Unix 毫秒。
        data:
          type: object
          required:
            - currentSeason
            - requestedSeason
            - availableSeasons
            - scheduleSummary
            - byWeekday
            - total
            - scope
            - limit
            - truncated
          properties:
            currentSeason:
              type: string
            requestedSeason:
              type:
                - string
                - "null"
              description: 全库关键词搜索为 null；按季查询返回指定季度，精确 ID 返回作品季度或 null。
            availableSeasons:
              type: array
              description: 当前季前后各 4 季中至少有一部公开番剧的季度，按时间升序，总是包含当前季。
              items:
                type: string
            scheduleSummary:
              type: object
              required:
                - scheduled
                - weekdayOnly
                - missingSource
              properties:
                scheduled:
                  type: number
                weekdayOnly:
                  type: number
                missingSource:
                  type: number
            byWeekday:
              type: array
              items:
                type: object
                required:
                  - weekday
                  - weekdayLabel
                  - animes
                properties:
                  weekday:
                    type:
                      - number
                      - "null"
                  weekdayLabel:
                    type: string
                  animes:
                    type: array
                    items:
                      $ref: "#/components/schemas/SeasonAnimeItem"
            total:
              type: integer
              description: 本次返回的条数，不是全部匹配数。
            scope:
              oneOf:
                - type: object
                  required:
                    - kind
                    - season
                  properties:
                    kind:
                      const: season
                    season:
                      type: string
                - type: object
                  required:
                    - kind
                    - query
                  properties:
                    kind:
                      const: query
                    query:
                      type: string
                    season:
                      type: string
                - type: object
                  required:
                    - kind
                    - bgmId
                  properties:
                    kind:
                      const: bgmId
                    bgmId:
                      type: integer
            limit:
              type: integer
              enum:
                - 1
                - 50
                - 200
            truncated:
              type: boolean
    AnimeGroupsResponse:
      type: object
      required:
        - ok
        - ts
        - data
      properties:
        ok:
          type: boolean
          enum:
            - true
        ts:
          type: number
        data:
          type: object
          required:
            - bgmId
            - animeId
            - title
            - groups
            - total
          properties:
            bgmId:
              type: number
            animeId:
              type: string
            title:
              $ref: "#/components/schemas/CatalogTitle"
            groups:
              type: array
              items:
                $ref: "#/components/schemas/AnimeGroup"
            total:
