                    <p>❁ Introduction<br>
                    　　上伊那牡丹以升入大学为契机，搬进了学生宿舍。她与宿舍的室友们一同前往秩父参加芝樱节，在长椅上发现宿舍长砺波伊吹正独自饮酒。看到伊吹喝高球酒时那副津津有味的样子，牡丹深受吸引，说道：“我也想尝尝那个”，于是品尝了人生中的第一口酒。由此领略到酒之美味的牡丹，开始与同住的宿舍同学们一起品尝烧酒、葡萄酒、威士忌等各式美酒，彼此之间的关系也日益加深。另一方面，因过去的苦涩经历而坚持“独自饮酒”的伊吹，在与那喝得开心又津津有味的牡丹相处的过程中，也逐渐萌生了想与她共饮的念头……</p>
