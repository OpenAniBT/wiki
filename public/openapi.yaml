  /api/releases/{releaseId}:
    delete:
      tags:
        - delete
      operationId: releases-delete
      summary: 删除番剧发布
      description: >
        需要 releases:delete，只支持本组 rel_* 资源。无 query、无请求体。

        最多等待约 2 秒：completed 返回 200，pending 返回 202；清理失败返回 500 RELEASE_DELETION_FAILED，回执在 error.details。同一有权限的调用方再次 DELETE 时返回原来那一次删除操作，状态码与该操作当前结果相同，不会另开一次删除。从未存在或无权访问的资源仍返回 404；404 不是删除完成的证明，请通过 GET /api/releases/{releaseId}/deletion 查询已有回执。

        202 只表示已受理；只有 completed 才表示本站删除完成。其他发布仍在使用的同一种子会保留，已删除发布自己的详情页和下载地址不再可用。不会撤回已同步到外站的资源。

        默认 30 次 / 60 秒 / API Key；pending 按 Retry-After 轮询状态。

        创建 Key 的普通成员只能删除自己的发布；owner/admin 可删除本组发布。
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AnimeReleaseId"
      responses:
        "200":
          description: 删除已完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionReceipt"
              examples:
                deletion-delete-completed:
                  summary: deletion-delete-completed
                  value:
                    ok: true
                    result:
                      operationId: rdel_example
                      releaseId: rel_example
                      state: completed
                      statusUrl: /api/releases/rel_example/deletion
                      acceptedAt: 1790294400000
                      updatedAt: 1790294410000
                      completedAt: 1790294410000
        "202":
          description: 已受理，按 Retry-After 轮询
          headers:
            Location:
              schema:
                type: string
            Retry-After:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionReceipt"
              examples:
                deletion-delete-pending:
                  summary: deletion-delete-pending
                  value:
                    ok: true
                    result:
                      operationId: rdel_example
                      releaseId: rel_example
                      state: pending
                      statusUrl: /api/releases/rel_example/deletion
                      acceptedAt: 1790294400000
                      updatedAt: 1790294400000
                      retryAfterMs: 2000
        "400":
          description: 请求体不为空
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: releaseId 或查询参数校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          description: 删除清理失败；error.details 含 failed 回执
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/releases/{releaseId}/deletion:
    get:
      tags:
        - delete
      operationId: releases-deletion
      summary: 删除状态
      description: >
        需要 releases:delete。无 query，只查询本组已有删除回执。

        成功查询始终返回 200，result.state 为 pending、completed 或 failed。pending 按 Retry-After 继续轮询；failed 停止自动重试并记录 failure 与 X-Request-ID。

        未知或跨组资源、没有删除记录时返回 404。默认 120 次 / 60 秒 / API Key。
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AnimeReleaseId"
      responses:
        "200":
          description: 删除回执
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionReceipt"
              examples:
                deletion-status-pending:
                  summary: deletion-status-pending
                  value:
                    ok: true
                    result:
                      operationId: rdel_example
                      releaseId: rel_example
                      state: pending
                      statusUrl: /api/releases/rel_example/deletion
                      acceptedAt: 1790294400000
                      updatedAt: 1790294400000
                      retryAfterMs: 2000
                deletion-status-completed:
                  summary: deletion-status-completed
                  value:
                    ok: true
                    result:
                      operationId: rdel_example
                      releaseId: rel_example
                      state: completed
                      statusUrl: /api/releases/rel_example/deletion
                      acceptedAt: 1790294400000
                      updatedAt: 1790294410000
                      completedAt: 1790294410000
                deletion-status-failed:
                  summary: deletion-status-failed
                  value:
                    ok: true
                    result:
                      operationId: rdel_example
                      releaseId: rel_example
                      state: failed
                      statusUrl: /api/releases/rel_example/deletion
                      acceptedAt: 1790294400000
                      updatedAt: 1790294410000
                      failedAt: 1790294410000
                      failure:
                        code: RELEASE_DELETION_FAILED
                        message: Example cleanup failure
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 缺少 releases:delete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: releaseId 或查询参数校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/releases/{releaseId}/sync-status:
    get:
      tags:
        - sync
      operationId: releases-sync-status
      summary: Release 外站同步状态
      description: >
        查询该 API Key 所属字幕组的普通 release 在六个外站的同步状态。

        请求只支持 `rel_...` 形式的 `releaseId`，且资源必须属于当前 Key 所属字幕组。

        不存在、已删除或跨组资源统一返回 `404 NOT_FOUND`。

        成功响应为 `{ ok: true, data: { releaseId, title, publishedAt, overall, sites } }`。

        `data.sites` 是数组，固定包含 `mikan`、`acgrip`、`bangumi`、`acgnx`、`dmhy`、`nyaa` 六个平台。遍历数组并用每项的 `site` 字段识别平台；不要读取 `data.mikan` 或 `data.nyaa`。

        每站提供当前状态、`externalId`、`externalUrl`、错误、`generation`、`attempt`、时间戳、最近 50 条 `history` 和该站的 `historyTruncated`。所有时间戳均为 Unix 毫秒。

        站点状态为 `not_started`、`pending`、`success`、`failed`、`ambiguous` 或 `deleted`。

        `data.overall` 是字符串：任一站为 `failed` 或 `ambiguous` 时为 `failed`；全部成功时为 `success`；全部未开始时为 `not_started`；其余情况有 `pending` 时为 `pending`，否则为 `partial`。

        接口不会返回外站原始响应正文或凭据，响应使用 `Cache-Control: no-store`。

        需要 `releases:sync:read`。

        不接受 query 或请求体。默认 120 次 / 60 秒 / API Key；超限按 Retry-After 退避。
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
