openapi: 3.1.0
info:
  title: AniBT Open API
  version: '1'
  summary: AniBT 公开 RSS 与 JSON API
  description: |
    生产 Base URL 为 https://anibt.net。每个端点的参数、鉴权和响应以其定义为准。
    JSON 成功响应有 data、result 和无包装三种形态；不要在客户端统一假定 data。RSS/Torznab 返回 XML，公开 RSS 的错误正文通常为纯文本。
    资源 ID 使用对应 rel_* / orel_*；字幕组过滤通常使用 slug，但其他类 RSS 的 groupId 使用组织 ID。
  contact:
    email: support@anibt.net
servers:
  - url: https://anibt.net
    description: 生产
tags:
  - name: catalog
    x-displayName: 目录与身份
    description: 字幕组目录与当前 Key 身份。
  - name: query
    x-displayName: 查询
    description: 番剧搜索、季度表、匹配。
  - name: rss
    x-displayName: RSS
    description: 番剧、全站磁力、其他类与个人订阅。
  - name: publish
    x-displayName: 发布
    description: 番剧与其他类发布。
  - name: delete
    x-displayName: 删除
    description: 删除番剧发布与状态轮询。
  - name: torrent
    x-displayName: 种子
    description: 公开种子下载。
  - name: sync
    x-displayName: 外站同步
    description: 查询普通 release 在六个外站的同步状态。
security: []
paths:
  /api/subtitle-groups:
    get:
      tags:
        - catalog
      operationId: subtitle-groups
      summary: 字幕组目录
      description: |
        可见字幕组列表。启动时拉一次，缓存 name → slug。
        本接口只返回可见项。全量返回。速率限制默认 60 次 / 60 秒 / IP。
        支持 GET、HEAD、OPTIONS；条件请求仍可能消耗限流额度。
      responses:
        "200":
          description: 可见字幕组列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubtitleGroupListResponse"
              examples:
                groups:
                  summary: 结构示例（数组节选）
                  value:
                    ok: true
                    data:
                      - slug: alicia
                        name: 艾莉希婭
                        organizationId: org_qplE6hvOXjvT
                        status: ACTIVE
                        totalReleases: 4
                        totalAnimes: 5
                        createdAt: 1781416887567
                      - slug: ani
                        name: ANi
                        organizationId: org_JNcJ-H_h2qb_
                        status: ACTIVE
                        totalReleases: 1373
                        totalAnimes: 114
                        createdAt: 1777368261421
        "304":
          description: ETag 未变，响应体为空
        "400":
          description: 无效的 status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - ACTIVE
          description: 省略或 ACTIVE；其他值返回 400。

  /api/subtitle-groups/me:
    get:
      tags:
        - catalog
      operationId: me
      summary: 字幕组自身信息
      description: |
        返回当前 API Key 所属字幕组的 organizationId、name、slug、ACTIVE 状态、统计和 scopes。
        使用有效 Key 即可，不要求 releases:publish。创建 Key 的用户必须仍然存在且仍为该组成员，Key 未撤销且字幕组为 ACTIVE；离组后即使未撤销 Key 也返回 401。响应 private, no-store。apiKeySuffix 不能用于鉴权。
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: 当前字幕组
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubtitleGroupMeResponse"
              examples:
                me-success:
                  summary: me-success
                  value:
                    ok: true
                    data:
                      organizationId: org_example
                      name: Example Group
                      slug: example
                      status: ACTIVE
                      createdAt: 1790294400000
                      stats:
                        totalReleases: 12
                        totalAnimes: 2
                        memberCount: 3
                      apiKeyId: sgak_example
                      apiKeySuffix: abcd1234
                      scopes:
                        - releases:sync:read
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: 未认证请求过于频繁
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/bgm/search:
    get:
      tags:
        - query
      operationId: bgm-search
      summary: Bangumi 搜索
      description: |
        把番剧名映射为 `bgmId`。站内未收录的作品搜不到。
        不保证第一条就是目标作品。结果按匹配程度分级：完全相等、前缀、子串、多词、字序、相似度；同级按热度排序。规则见「开放 API 总览」的「番剧搜索」。
        拼写容错来自相似度：长标题能容忍少量拼写差异，短单词的字母换位可能找不到。1–2 个字符的查询不做相似度匹配，也不匹配词中间的字母。年份没有单独的规则，与其他词一样匹配。纯数字 q 仍按 Bangumi ID 查询。
        `limit` 默认 5，上限 25。速率限制默认 60 次 / 60 秒 / IP。
        q、limit 均只允许出现一次；无效查询返回 422。
        支持 GET、HEAD、OPTIONS；条件请求仍可能消耗限流额度。
      parameters:
        - name: q
          in: query
          required: true
          description: 中、英、日或罗马音关键词，也可传纯数字 Bangumi ID；去除首尾空白后 1–100 字符，禁止控制字符。
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: limit
          in: query
          description: 条数，默认 5，上限 25
          schema:
            type: integer
            default: 5
            minimum: 1
            maximum: 25
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BgmSearchResponse"
              examples:
                bgm:
                  summary: 结构示例（数组节选）
                  value:
                    ok: true
                    data:
                      - bgmId: 543360
                        name: 上伊那ぼたん、酔へる姿は百合の花
                        nameCn: 上伊那牡丹，酒醉身姿似百合花般
                        date: null
                        image: https://r2.anibt.net/anime_covers/nh73r0ernee7s0afv9s82f763983gcz7/cbbbd63dd8c9cff7da4b665651347ee5eae20c98567ea5572abbeccf40f8d87a/v4/w240.webp
                        rating: 7.1
                        totalEpisodes: 25
                        url: https://bgm.tv/subject/543360
                        premiere: null
                        seasonYear: null
                        season: null
        "304":
          description: ETag 未变，响应体为空
        "422":
          description: 查询参数未通过校验
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: 搜索失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: 搜索暂不可用，返回 SEARCH_UNAVAILABLE。按 Retry-After 等待后重试
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/seasons/anime:
    get:
      tags:
        - query
      operationId: seasons-anime
      summary: 季度番剧
      description: |
        季度浏览、全库标题搜索或精确 ID 查询。`bgmId` 优先于 `season`，不能与 `query` 同时使用。
        `scope.kind` 区分 season、query、bgmId；全库 query 的 `requestedSeason` 为 null，不代表首条结果的季度。
        季度浏览最多 200 条，超过时按人气档位、再按评分取前 200；query 最多 50 条。`total` 是本次返回数，`truncated` 表示仍有结果。完整翻页请用 /api/animes/search。
        query 的匹配规则见「开放 API 总览」的「番剧搜索」。搜索排名只决定哪些番剧进入最多 50 条的结果；响应仍按星期分组，组内按播出时间和标题排序。暂时无法完成读取时返回 503 SEARCH_UNAVAILABLE，带 Retry-After。
        已合并的旧 bgmId 返回合并后的番剧：`scope.bgmId` 保持请求值，条目的 `bgmId` 是合并后的 ID。管理员隐藏或 bgm.tv 标记为 NSFW 的番剧不出现在任何结果里。
        每部作品携带自己的年季与首播精度。季度分类不改变实际首播日期；未知值为 null。
        `weekday` 来自番剧的放送规则，依次取管理员设置、bangumi-data 放送区间、bgm.tv 分集播出日、精确到日的首播日；0=周日 … 6=周六，按北京时间。null 表示没有放送规则，归入「未排播」。
        `rating` 为 0–10，无有效来源评分时为 5.0，真实 0 保留。
        `availableSeasons` 是当前季前后各 4 季中有公开番剧的季度，总是包含当前季。
        速率限制默认 30 次 / 60 秒 / IP。支持 GET、HEAD、OPTIONS；条件请求仍可能消耗限流额度。
      parameters:
        - name: season
          in: query
          description: 季度。如 2026春 / 2026-SPRING。默认当前季
          schema:
            type: string
        - name: bgmId
          in: query
          description: 精确查一部；忽略 season
          schema:
            type: integer
        - name: query
          in: query
          description: 标题搜索，别名 q，最长 120 字符，最多 50 条
          schema:
            type: string
            maxLength: 120
        - name: q
          in: query
          description: query 的别名
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: 季度番剧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonsAnimeResponse"
              examples:
                season:
